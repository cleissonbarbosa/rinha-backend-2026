services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rinha-nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "16MB"

  api1:
    image: cleissonb/rinha-backend-2026-nim:latest
    container_name: rinha-api1
    environment:
      - API_PORT=8080
      - VECTORS_PATH=/data/vectors.bin
      - LABELS_PATH=/data/labels.bin
      - IVF_PATH=/data/ivf.bin
      - HTTP_THREADS=1
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "167MB"

  api2:
    image: cleissonb/rinha-backend-2026-nim:latest
    container_name: rinha-api2
    environment:
      - API_PORT=8080
      - VECTORS_PATH=/data/vectors.bin
      - LABELS_PATH=/data/labels.bin
      - IVF_PATH=/data/ivf.bin
      - HTTP_THREADS=1
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "167MB"

networks:
  rinha:
    driver: bridge
