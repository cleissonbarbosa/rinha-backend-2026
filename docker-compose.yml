services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rinha-nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "32MB"

  api1:
    build: .
    image: rinha-backend-2026-nim:latest
    container_name: rinha-api1
    environment:
      - API_PORT=8080
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "128MB"

  api2:
    build: .
    image: rinha-backend-2026-nim:latest
    container_name: rinha-api2
    environment:
      - API_PORT=8080
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "128MB"

networks:
  rinha:
    driver: bridge

