services:
  lb:
    image: cleissonb/rinha-backend-2026-hare-lb:0.2.2
    container_name: rinha-lb
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    volumes:
      - sockets:/sockets
    networks:
      rinha:
        ipv4_address: 172.30.0.10
    cpus: 0.36
    mem_limit: 40m

  api1:
    image: cleissonb/rinha-backend-2026-nim:0.2.2
    pull_policy: always
    container_name: rinha-api1
    environment:
      - API_PORT=8080
      - VECTORS_PATH=/data/vectors.bin
      - LABELS_PATH=/data/labels.bin
      - RESIDUALS_PATH=/data/residuals.bin
      - IVF_PATH=/data/ivf.bin
      - HTTP_THREADS=1
      - SOCKET_PATH=/sockets/api1.sock
    volumes:
      - sockets:/sockets
    networks:
      rinha:
        ipv4_address: 172.30.0.11
    cpus: 0.30
    mem_limit: 149m

  api2:
    image: cleissonb/rinha-backend-2026-nim:0.2.0
    pull_policy: always
    container_name: rinha-api2
    environment:
      - API_PORT=8080
      - VECTORS_PATH=/data/vectors.bin
      - LABELS_PATH=/data/labels.bin
      - RESIDUALS_PATH=/data/residuals.bin
      - IVF_PATH=/data/ivf.bin
      - HTTP_THREADS=1
      - SOCKET_PATH=/sockets/api2.sock
    volumes:
      - sockets:/sockets
    networks:
      rinha:
        ipv4_address: 172.30.0.12
    cpus: 0.30
    mem_limit: 149m

  prewarmer:
    image: cleissonb/rinha-prewarmer:0.1.0
    container_name: rinha-prewarmer
    environment:
      PREWARM_TARGET: lb:9999
      PREWARM_ROUNDS: "48"
    depends_on:
      - lb
    networks:
      rinha:
        ipv4_address: 172.30.0.20
    cpus: 0.04
    mem_limit: 12m
    restart: "no"

networks:
  rinha:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
