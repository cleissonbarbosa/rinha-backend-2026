worker_processes 1;
worker_rlimit_nofile 16384;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    error_log /dev/stderr crit;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_requests 100000;
    keepalive_timeout 75s;

    upstream api {
        server api1:8080 max_fails=0;
        server api2:8080 max_fails=0;
        keepalive 256;
        keepalive_requests 100000;
        keepalive_time 1h;
    }

    server {
        listen 9999 reuseport backlog=8192 deferred;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 50ms;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_pass http://api;
        }
    }
}
